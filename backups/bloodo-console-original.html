<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloodo for Blood Centres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0EA; --surface:#EDE8E1; --card:#FBF8F4; --raise:#FFFFFF;
  --ink:#1A1612; --ink-2:rgba(26,22,18,.72); --ink-3:rgba(26,22,18,.6);
  --line:rgba(26,22,18,.11); --line-2:rgba(26,22,18,.18);
  --red:#B03020; --red-ink:#FFFFFF; --red-tint:#FDF1EF; --red-mid:#E8C4BE;
  --ok:#2C7A41; --ok-bg:#EAF4EB; --warn:#965606; --warn-bg:#FBF2E3;
  --calm:#3D5A80; --calm-bg:#EDF1F7;
  --wa:#1F7A53; --wa-bg:#E3F1E6; --wa-out:#DCF5D3;
  --shadow:0 1px 2px rgba(26,22,18,.03), 0 24px 48px -28px rgba(90,40,25,.22);
  --shadow-red:0 14px 30px -14px rgba(176,48,32,.55);
  --glass:rgba(255,255,255,.55); --glass-line:rgba(255,255,255,.8); --glass-strong:rgba(255,253,250,.72);
  --glow-a:rgba(176,48,32,.10); --glow-b:rgba(214,140,90,.10);
  --serif:"DM Serif Display", Georgia, "Times New Roman", serif;
  --sans:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12100E; --surface:#1C1814; --card:#211C17; --raise:#28221C;
    --ink:#F5F0EA; --ink-2:rgba(245,240,234,.76); --ink-3:rgba(245,240,234,.62);
    --line:rgba(245,240,234,.1); --line-2:rgba(245,240,234,.18);
    --red:#E5604D; --red-ink:#1A0F0C; --red-tint:#2C1A17; --red-mid:#55302A;
    --ok:#7CC48C; --ok-bg:#18261B; --warn:#E3A452; --warn-bg:#2A2116;
    --calm:#9DB6DA; --calm-bg:#1A2130;
    --wa:#7FD3A5; --wa-bg:#16271E; --wa-out:#1D3326;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.6);
    --shadow-red:0 14px 30px -14px rgba(229,96,77,.45);
    --glass:rgba(38,32,27,.62); --glass-line:rgba(255,255,255,.07); --glass-strong:rgba(34,29,24,.8);
    --glow-a:rgba(229,96,77,.10); --glow-b:rgba(200,120,70,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12100E; --surface:#1C1814; --card:#211C17; --raise:#28221C;
  --ink:#F5F0EA; --ink-2:rgba(245,240,234,.76); --ink-3:rgba(245,240,234,.62);
  --line:rgba(245,240,234,.1); --line-2:rgba(245,240,234,.18);
  --red:#E5604D; --red-ink:#1A0F0C; --red-tint:#2C1A17; --red-mid:#55302A;
  --ok:#7CC48C; --ok-bg:#18261B; --warn:#E3A452; --warn-bg:#2A2116;
  --calm:#9DB6DA; --calm-bg:#1A2130;
  --wa:#7FD3A5; --wa-bg:#16271E; --wa-out:#1D3326;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.6);
  --shadow-red:0 14px 30px -14px rgba(229,96,77,.45);
  --glass:rgba(38,32,27,.62); --glass-line:rgba(255,255,255,.07); --glass-strong:rgba(34,29,24,.8);
  --glow-a:rgba(229,96,77,.10); --glow-b:rgba(200,120,70,.05);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1100px 620px at 88% -8%,var(--glow-a),transparent 62%),radial-gradient(900px 600px at -12% 108%,var(--glow-b),transparent 60%)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:12px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.005em}
h1{font-size:clamp(30px,4vw,42px);line-height:1.08}
h2{font-size:24px;line-height:1.15}
h3{font-size:19px;line-height:1.2}
p{margin:0}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13px}
.light{font-weight:300}
.mid{font-weight:500}

/* shell: floating glass nav (from Bloodo's glassy-bubble) */
.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
@supports (backdrop-filter:blur(1px)){.glass{backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}}
.navwrap{position:sticky;top:calc(14px + env(safe-area-inset-top,0px));z-index:30;padding:0 clamp(14px,3vw,32px)}
.topnav{max-width:1180px;margin:14px auto 0;display:flex;align-items:center;gap:16px;padding:8px 8px 8px 18px;border-radius:999px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand-mark{width:34px;height:34px;border-radius:12px;background:var(--red);display:grid;place-items:center;color:var(--red-ink);box-shadow:var(--shadow-red)}
.brand-name{font-family:var(--serif);font-size:25px;line-height:1}
.brand small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:2px;max-width:24ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:flex;gap:2px;margin:0 auto;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.links a{display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:14.5px;transition:background .2s,color .2s}
.links a:hover{color:var(--ink)}
.links a[aria-current="page"]{background:var(--raise);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 16px -10px rgba(0,0,0,.25)}
.links .count{font-size:11.5px;background:var(--red);color:var(--red-ink);min-width:19px;height:19px;padding:0 6px;border-radius:99px;display:inline-grid;place-items:center;font-weight:500}
.navact{display:flex;align-items:center;gap:8px}
.main{min-width:0;padding:40px clamp(18px,4vw,48px) 90px}
.wrap{max-width:1180px;margin:0 auto}
.tabbar{display:none}
.foot{max-width:1180px;margin:56px auto 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--ink-3);font-size:13px}

/* page head */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.head .sub{margin-top:8px;color:var(--ink-2);font-weight:300;font-size:16px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-size:14px;margin-bottom:14px}
.back:hover{color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:500;font-size:15px;background:var(--surface);color:var(--ink);transition:transform .15s,filter .2s,background .2s;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--red) 88%,#fff),var(--red));color:var(--red-ink);box-shadow:var(--shadow-red),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover{transform:translateY(-1px)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:.5px solid var(--line-2)}
.btn.lg{padding:16px 28px;font-size:16px}
.btn.xl{padding:19px 34px;font-size:17px}
.btn.sm{padding:7px 14px;font-size:13.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink)}

/* cards */
.card{background:var(--glass);border:1px solid var(--glass-line);border-radius:32px;box-shadow:var(--shadow)}
.pad{padding:24px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
.section-title h2{font-size:22px}
.section-title a{font-size:14px;color:var(--red);text-decoration:none;font-weight:500}

/* blood group token: the signature element */
.tok{flex:none;width:68px;height:68px;border-radius:22px;background:var(--red-tint);color:var(--red);display:grid;place-items:center;font-family:var(--serif);font-size:30px;line-height:1;border:.5px solid var(--red-mid)}
.tok.xl{width:112px;height:112px;border-radius:34px;font-size:54px}
.tok.sm{width:44px;height:44px;border-radius:15px;font-size:19px}
.tok.xs{width:34px;height:34px;border-radius:12px;font-size:15px}
.tok.quiet{background:var(--surface);color:var(--ink);border-color:var(--line)}

/* pills / status */
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:500;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.red{background:var(--red-tint);color:var(--red)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.calm{background:var(--calm-bg);color:var(--calm)}
.pill.live .dot{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.45)}}

/* request card */
.req{display:flex;gap:18px;align-items:center;padding:20px 22px;text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s}
.req:hover{transform:translateY(-2px)}
.req .body{flex:1;min-width:0}
.req .title{font-size:17px;font-weight:500}
.req .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px;color:var(--ink-2);font-size:14px}
.req .right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}

/* unit slots (from Bloodo streak grid) */
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;border:.5px dashed var(--red-mid);color:var(--red-mid)}
.slot.c{border-style:solid;border-color:var(--red-mid);background:var(--red-tint);color:var(--red)}
.slot.d{border-style:solid;border-color:var(--red);background:var(--red);color:var(--red-ink)}
.slots.lg .slot{width:40px;height:40px;border-radius:13px}

/* ready grid */
.ready{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ready a{display:flex;flex-direction:column;gap:2px;padding:14px 14px 12px;border-radius:20px;background:var(--surface);text-decoration:none;color:inherit;border:.5px solid transparent}
.ready a:hover{border-color:var(--line-2)}
.ready .g{font-family:var(--serif);font-size:24px;line-height:1}
.ready .n{font-size:13px;color:var(--ink-2);white-space:nowrap}
.ready a.low{background:var(--warn-bg)}
.ready a.low .n{color:var(--warn);font-weight:500}

/* list rows */
.rows{display:flex;flex-direction:column}
.rowi{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:.5px solid var(--line)}
.rowi:first-child{border-top:0}
.av{flex:none;width:40px;height:40px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:14px;font-weight:500;color:var(--ink-2)}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* board */
.board-head{display:flex;gap:26px;align-items:center;padding:28px;border-radius:36px}
.board-head .info{flex:1;min-width:0}
.board-head .title{font-family:var(--serif);font-size:clamp(26px,3vw,34px);line-height:1.1}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;color:var(--ink-2);font-size:14.5px}
.facts span{display:inline-flex;align-items:center;gap:6px}
.wave{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px;padding:14px 18px;border-radius:20px;background:var(--surface)}
.wave .track{flex:1;min-width:140px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.wave .track i{display:block;height:100%;background:var(--red);border-radius:9px;transition:width 1s linear}
.lane{margin-top:26px}
.lane-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lane-h h3{font-size:18px}
.lane-h .n{font-size:13px;color:var(--ink-3)}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dc{padding:18px;border-radius:26px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;transition:border-color .3s, background .3s}
.dc.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--ok-bg);border-color:var(--ok);transform:scale(1.02)}100%{background:var(--glass)}}
.dc .top{display:flex;gap:12px;align-items:center}
.dc .name{font-weight:500}
.dc .sub{font-size:13px;color:var(--ink-2)}
.dc .acts{display:flex;gap:8px;flex-wrap:wrap}
.quiet-list .rowi{padding:10px 4px}
details.fold summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary .chev{transition:transform .2s;color:var(--ink-3)}
details.fold[open] summary .chev{transform:rotate(90deg)}

/* whatsapp preview */
.wa{background:var(--wa-bg);border-radius:24px;padding:16px}
.wa-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--wa);font-weight:500;margin-bottom:12px}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-line;background:var(--raise);box-shadow:0 1px 1px rgba(0,0,0,.05)}
.bub.out{margin-left:auto;background:var(--wa-out);border-bottom-right-radius:6px}
.bub.in{border-bottom-left-radius:6px}
.bub .t{display:block;text-align:right;font-size:11.5px;color:var(--ink-3);margin-top:3px}
.bub-btns{display:flex;flex-direction:column;gap:4px;margin:4px 0 0 auto;max-width:88%}
.bub-btns span{display:block;text-align:center;padding:8px;border-radius:12px;background:var(--raise);color:var(--wa);font-size:14px;font-weight:500}
.chat{display:flex;flex-direction:column;gap:8px}
.chat .note{align-self:center;font-size:12.5px;color:var(--ink-3);padding:3px 10px;border-radius:99px;background:var(--raise)}

/* forms */
.field{display:flex;flex-direction:column;gap:7px}
.field > label,.lbl{font-size:13.5px;color:var(--ink-2);font-weight:500}
.input,select.input,textarea.input{width:100%;padding:13px 16px;border-radius:16px;border:.5px solid var(--line-2);background:var(--raise);outline:none;transition:border-color .2s, box-shadow .2s;font-size:15px}
.input:focus{border-color:var(--red);box-shadow:0 0 0 4px var(--red-tint)}
.input.err{border-color:var(--red)}
.input:disabled{opacity:.45}
.m-slots{display:none}
.hint{font-size:13px;color:var(--ink-3)}
.err-t{font-size:13px;color:var(--red);font-weight:500}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .full{grid-column:1/-1}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.choice span{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:52px;padding:10px 16px;border-radius:999px;background:var(--surface);border:.5px solid transparent;font-weight:500;font-size:14.5px;transition:all .15s}
.choice input:checked + span{background:var(--red-tint);color:var(--red);border-color:var(--red-mid)}
.choice input:focus-visible + span{outline:2px solid var(--red);outline-offset:2px}
.choices.groups .choice span{font-family:var(--serif);font-weight:400;font-size:19px;min-width:62px;padding:9px 12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--surface);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--red);margin:1px 0 0;flex:none}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:4px}
.stepper button{width:38px;height:38px;border-radius:50%;border:0;background:var(--raise);font-size:18px}
.stepper output{min-width:44px;text-align:center;font-family:var(--serif);font-size:22px}
.preview{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:20px;background:var(--red-tint);color:var(--ink)}
.preview b{font-weight:500}
.notice{padding:13px 16px;border-radius:16px;background:var(--warn-bg);color:var(--warn);font-size:14px}

/* toolbar / table */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .input{padding-left:44px;border-radius:999px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:.5px solid var(--line-2);background:transparent;padding:7px 13px;border-radius:999px;font-size:13.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.g{font-family:var(--serif);font-size:15px;padding:6px 12px}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-weight:500;font-size:13px;color:var(--ink-3);padding:12px 16px;border-bottom:.5px solid var(--line)}
.table td{padding:13px 16px;border-bottom:.5px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{cursor:pointer;transition:background .15s}
.table tbody tr:hover{background:var(--surface)}
.scroll-x{overflow-x:auto}
.empty{padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{font-size:22px}

/* overlay: sheet + drawer */
.ov{position:fixed;inset:0;z-index:50;display:none}
.ov.open{display:block}
.ov .scrim{position:absolute;inset:0;background:rgba(18,16,14,.38);animation:fade .2s ease-out}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--bg);border-radius:36px;box-shadow:0 30px 80px -20px rgba(0,0,0,.35);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.sheet.wide{width:min(760px,calc(100vw - 32px))}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 28px 16px;background:var(--bg)}
.sheet-b{padding:4px 28px 28px;display:flex;flex-direction:column;gap:22px}
.sheet-f{position:sticky;bottom:0;padding:16px 28px 24px;background:linear-gradient(to top,var(--bg) 75%,transparent);display:flex;gap:10px;justify-content:flex-end}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--bg);overflow:auto;box-shadow:-20px 0 60px -20px rgba(0,0,0,.3);animation:slide .28s cubic-bezier(.2,.8,.2,1);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translate(-50%,-46%)}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:14.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;text-align:right}

/* toast */
.toasts{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14.5px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:tin .3s cubic-bezier(.2,.8,.2,1)}
.toast.ok svg{color:#9FE0AE}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

.demo-note{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.view{animation:viewin .32s ease-out}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;margin:8px 0 56px}
.hero .date{color:var(--red);font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;margin-bottom:18px}
.hero h1{font-size:clamp(38px,4.9vw,60px);line-height:1.02;letter-spacing:-.015em}
.hero h1 em{font-style:italic;color:var(--ink-3)}
.hero .lede{margin-top:20px;font-size:18px;font-weight:300;color:var(--ink-2);max-width:46ch;line-height:1.55}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.signal{position:relative;padding:22px;border-radius:40px}
.signal-cap{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:4px 6px 0}
.signal-cap .t{font-family:var(--serif);font-size:22px;line-height:1.15}
.signal-cap .s{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:12.5px;color:var(--ink-2);padding:0 6px 4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* signal map */
.radar{display:block;width:100%;height:auto;max-height:440px;margin:0 auto}
.radar .ring{fill:none;stroke:var(--line-2);stroke-width:1}
.radar .ring.dash{stroke-dasharray:3 5}
.radar .rl{font:500 11px var(--sans);fill:var(--ink-3)}
.radar .pulse{fill:none;stroke:var(--red);stroke-width:1.5;transform-origin:200px 200px;animation:ripple 3.6s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes ripple{0%{transform:scale(.12);opacity:.55}100%{transform:scale(1);opacity:0}}
.radar .core{fill:var(--red)}
.radar .core-h{fill:var(--red);opacity:.14}
.radar .dot{cursor:pointer;transition:opacity .3s}
.radar .dot:hover{opacity:.75}
.radar .w{fill:var(--bg);stroke:var(--ink-3);stroke-width:1.6}
.radar .y{fill:var(--ok)} .radar .yh{fill:var(--ok);opacity:.18}
.radar .a{fill:var(--calm)} .radar .ah{fill:var(--calm);opacity:.18}
.radar .d{fill:var(--red)} .radar .dh{fill:var(--red);opacity:.16}
.radar .o{fill:var(--line-2)}
.radar .pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0)}}

/* list panel */
.panel{border-radius:34px;padding:8px 10px}
.rrow{display:flex;align-items:center;gap:18px;padding:16px 14px;border-radius:24px;text-decoration:none;color:inherit;transition:background .2s}
.rrow+.rrow{box-shadow:0 -1px 0 var(--line)}
.rrow:hover{background:color-mix(in srgb,var(--raise) 70%,transparent);box-shadow:none}
.rrow:hover+.rrow{box-shadow:none}
.rrow .tok{width:58px;height:58px;border-radius:50%;font-size:24px}
.rrow .tok.sm{width:46px;height:46px;font-size:19px}
.rrow .tok.xs{width:36px;height:36px;font-size:15px}
.rrow .title{font-size:16.5px;font-weight:500}
.rrow .meta{font-size:14px;color:var(--ink-2);margin-top:2px;display:flex;gap:4px 14px;flex-wrap:wrap}
.rrow .end{display:flex;align-items:center;gap:18px}
.rrow .chev{color:var(--ink-3)}

/* section header */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px;padding:0 4px}
.sh h2{font-size:28px}
.sh p{font-size:14px;color:var(--ink-2)}
.sh a{font-size:14px;color:var(--red);text-decoration:none;font-weight:500}
.block{margin-top:52px}

/* arrivals strip */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.arr{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:26px;text-decoration:none;color:inherit}
.arr .av{border-radius:50%;width:46px;height:46px;background:var(--ok-bg);color:var(--ok)}
.arr.here .av{background:var(--calm-bg);color:var(--calm)}

/* donor pool shelf */
.shelf{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:clamp(8px,1.6vw,18px);align-items:end;padding:28px 26px 22px;border-radius:36px}
.shelf a{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:inherit}
.shelf .bar{position:relative;width:100%;max-width:72px;height:170px;border-radius:999px;background:color-mix(in srgb,var(--surface) 80%,transparent);overflow:hidden;display:flex;align-items:flex-end}
.shelf .bar i{display:block;width:100%;border-radius:999px;background:linear-gradient(180deg,color-mix(in srgb,var(--red) 70%,#fff),var(--red));min-height:44px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.shelf .bar b{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-weight:500;font-size:15px;color:var(--red-ink)}
.shelf a.low .bar i{background:linear-gradient(180deg,#E9B66E,#C78424)}
.shelf .gl{font-family:var(--serif);font-size:24px;line-height:1}
.shelf a:hover .bar{outline:2px solid var(--red-mid);outline-offset:3px}
.shelf-note{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:14px;padding:0 6px;font-size:14px;color:var(--ink-2)}

/* request hero */
.rhero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center;padding:30px 30px 30px 38px;border-radius:44px}
.rhero h1{font-size:clamp(40px,5vw,62px);line-height:1}
.rhero h1 em{font-style:italic;color:var(--ink-3)}
.rhero .lede{margin-top:12px;font-size:17px;color:var(--ink-2);font-weight:300}
.rhero .facts{margin-top:16px}
.rhero .conf{display:flex;align-items:center;gap:14px;margin-top:22px}

/* quick request composer */
.quick{display:flex;flex-direction:column;gap:26px;padding:32px 34px 26px;border-radius:42px}
.quick-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.quick-h h2{font-size:clamp(28px,3vw,36px);line-height:1.05}
.quick-h p{margin-top:6px}
.quick-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:34px;align-items:start}
.qside{display:flex;flex-direction:column;gap:22px}
.qf{border:0;margin:0;padding:0;min-width:0}
.qlbl{padding:0;margin-bottom:12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.gtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gtile{position:relative;cursor:pointer}
.gtile input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.gt-in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1/1;border-radius:28px;background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:0 10px 24px -18px rgba(90,40,25,.35);transition:transform .35s cubic-bezier(.2,1.4,.4,1),background .25s,box-shadow .25s,color .25s}
.gt-g{font-family:var(--serif);font-size:clamp(26px,2.6vw,34px);line-height:1}
.gt-n{font-size:12px;color:var(--ink-3);font-weight:500}
.gtile.low .gt-n{color:var(--warn)}
.gtile:hover .gt-in{transform:translateY(-3px)}
.gtile input:checked + .gt-in{background:linear-gradient(160deg,color-mix(in srgb,var(--red) 82%,#fff),var(--red));color:var(--red-ink);border-color:transparent;box-shadow:var(--shadow-red);transform:scale(1.04)}
.gtile input:checked + .gt-in .gt-n{color:inherit;opacity:.85}
.gtile input:focus-visible + .gt-in{outline:2px solid var(--red);outline-offset:3px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:4px;border-radius:22px;background:color-mix(in srgb,var(--surface) 85%,transparent)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:44px;padding:8px 6px;border-radius:18px;font-size:14.5px;font-weight:500;color:var(--ink-2);text-align:center;transition:background .2s,color .2s,box-shadow .2s}
.seg label:hover span{color:var(--ink)}
.seg input:checked + span{background:var(--raise);color:var(--red);box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 18px -10px rgba(0,0,0,.3)}
.seg input:focus-visible + span{outline:2px solid var(--red);outline-offset:1px}
.seg2 span{min-height:58px}
.seg2 b{font-weight:500;font-size:14px}
.seg2 small{font-size:12px;color:var(--ink-3);font-weight:400}
.seg2 input:checked + span small{color:var(--red);opacity:.8}
.units{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.quick-f{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 22px;margin:0 -12px -6px;border-radius:30px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.q-sum{font-family:var(--serif);font-size:22px;line-height:1.2;margin-bottom:4px}
.q-sum em{font-style:italic;color:var(--red)}
.shelf.compact .bar{height:110px}
.shelf.compact{padding:22px 24px 18px}

/* phone counter + date picker */
.ph-c{flex:none;font-size:12px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.ph-c.good{color:var(--ok)} .ph-c.bad{color:var(--red)}
.dpw{display:flex;flex-direction:column;gap:6px;min-width:0}
.dp-hint{padding:0 8px} .dp-hint.good{color:var(--ok)} .dp-hint.bad{color:var(--red);font-weight:500}
.dp-pop{max-height:none;width:max(100%,320px);padding:12px;background:var(--raise);backdrop-filter:none;-webkit-backdrop-filter:none}
.dp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.dp-h .iconbtn{width:36px;height:36px}
.dp-title{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font-family:var(--serif);font-size:19px;padding:6px 12px;border-radius:14px}
.dp-title:hover{background:var(--red-tint);color:var(--red)}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dp-wd{font-size:11px;font-weight:500;color:var(--ink-3);text-align:center;padding:4px 0 6px}
.dp-day{aspect-ratio:1;border:0;border-radius:12px;background:transparent;font-size:14px;font-weight:500;color:var(--ink);display:grid;place-items:center;transition:background .15s}
.dp-day:hover{background:var(--red-tint);color:var(--red)}
.dp-day.today{box-shadow:inset 0 0 0 1.5px var(--red-mid)}
.dp-day.sel{background:var(--red);color:var(--red-ink);box-shadow:var(--shadow-red)}
.dp-day[disabled],.dp-cell[disabled]{opacity:.25;pointer-events:none}
.dp-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dp-cells.years{grid-template-columns:repeat(4,1fr);max-height:260px;overflow:auto}
.dp-cell{border:0;border-radius:16px;background:var(--surface);padding:12px 6px;font-weight:500;font-size:14px}
.dp-cell:hover{background:var(--red-tint);color:var(--red)}
.dp-cell.sel{background:var(--red);color:var(--red-ink)}
.dp-f{display:flex;justify-content:flex-end;margin-top:8px}
button.bf[disabled]{cursor:not-allowed}

/* planning screens */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{display:flex;flex-direction:column;gap:6px;padding:22px 24px;border-radius:30px;text-decoration:none;color:inherit;transition:transform .25s}
a.kpi:hover{transform:translateY(-3px)}
.k-l{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-2)}
.k-n{font-family:var(--serif);font-size:44px;line-height:1.05}
.k-n small{font-family:var(--sans);font-size:15px;color:var(--ink-2);margin-left:4px}
.k-s{font-size:13.5px;color:var(--ink-2)}
.dblock{flex:none;width:58px;height:58px;border-radius:20px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dblock b{font-family:var(--serif);font-weight:400;font-size:24px}
.dblock small{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.dblock.today{background:var(--red);color:var(--red-ink)} .dblock.today small{color:inherit;opacity:.85}
.rrow .end .tok.xs{border-radius:50%}
.pill.sm{font-size:12px;padding:2px 9px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:16px;padding:22px;border-radius:32px;text-decoration:none;color:inherit;transition:transform .25s}
.pcard:hover{transform:translateY(-3px)}
.pcard .title{font-size:17px;font-weight:500}
.pnext{display:flex;align-items:center;gap:14px;padding:12px;border-radius:22px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.pnext .dblock{background:var(--raise)}
.calstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.calday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px 14px;border-radius:26px;background:var(--glass);border:1px solid var(--glass-line);text-align:center}
.calday.past{opacity:.55}
.calday.next{border-color:var(--red-mid);background:var(--red-tint)}
.cd-d{font-size:12px;color:var(--ink-2);font-weight:500}
.cd-n{font-family:var(--serif);font-size:30px;line-height:1.1}
.cd-m{font-size:12px;color:var(--ink-3)}
.cd-s{margin-top:8px;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:4px;justify-content:center;flex-wrap:wrap}
.cnum{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:500;background:var(--surface);color:var(--ink-2)}
.cnum.on{background:var(--red);color:var(--red-ink)}
.ftable td,.ftable th{white-space:nowrap}
.ftable td .tok.xs{border-radius:50%}

/* BloodConnect-style bubble fields */
.bf{position:relative;display:flex;flex-direction:column;justify-content:center;gap:8px;width:100%;min-height:80px;padding:15px 20px;border-radius:28px;background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:0 1px 2px rgba(26,22,18,.03),0 14px 30px -22px rgba(90,40,25,.25);text-align:left;color:var(--ink);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s;cursor:text}
button.bf{cursor:pointer;font:inherit}
.bf:hover{transform:scale(1.012)}
.bf:focus-within,.ss.open .bf{border-color:var(--red-mid);box-shadow:0 0 0 4px var(--red-tint),0 18px 36px -22px rgba(176,48,32,.35);transform:scale(1.012)}
.bf.err{border-color:var(--red);box-shadow:0 0 0 4px var(--red-tint)}
.bf-l{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:500;line-height:1}
.bf-l .opt{text-transform:none;letter-spacing:0;font-size:12px;opacity:.85}
.bf-row{display:flex;align-items:center;gap:10px;min-width:0}
.bf-row > svg{color:var(--ink-3);flex:none}
.bf-row .pre{font-weight:500;color:var(--ink-3)}
.bf input,.bf select{border:0;background:transparent;outline:none;padding:0;margin:0;width:100%;min-width:0;font-size:15.5px;font-weight:500;color:var(--ink)}
.bf input::placeholder{color:var(--ink-3);opacity:.7;font-weight:400}
.bf-v{flex:1;min-width:0;font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bf-v.ph{color:var(--ink-3);font-weight:400}
.bf-date input[type="date"]::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:0;cursor:pointer}
.bf.disabled{opacity:.45;pointer-events:none}
.agebadge{flex:none;width:42px;height:42px;margin:-6px 0;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.agebadge b{font-size:14px;color:var(--red);font-weight:500}
.agebadge small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.agebadge.warn{background:var(--warn-bg)} .agebadge.warn b{color:var(--warn)}
.ss{position:relative}
.ss.open{z-index:45}
.ss-chev{color:var(--ink-3);display:grid;transition:transform .4s}
.ss.open .ss-chev{transform:rotate(180deg)}
.ss-pop{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:46;display:flex;flex-direction:column;max-height:330px;padding:8px;border-radius:30px;background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:0 30px 60px -20px rgba(40,20,10,.35);animation:ssin .32s cubic-bezier(.2,1.2,.3,1)}
@supports (backdrop-filter:blur(1px)){.ss-pop{backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%)}}
@keyframes ssin{from{opacity:0;transform:translateY(8px) scale(.96)}}
.ss-pop[hidden]{display:none}
.ss-search{position:relative;display:block;margin:2px 2px 6px}
.ss-search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.ss-search input{width:100%;padding:11px 14px 11px 38px;border-radius:18px;border:.5px solid var(--line-2);background:color-mix(in srgb,var(--bg) 60%,transparent);outline:none;font-size:14.5px}
.ss-search input:focus{border-color:var(--red-mid);background:var(--raise)}
.ss-list{overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding:1px 2px}
.ss-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 16px;border:0;border-radius:18px;background:transparent;text-align:left;font-size:14.5px;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s}
.ss-opt small{font-weight:400;color:var(--ink-3)}
.ss-opt:hover,.ss-opt.hl{background:var(--red-tint);color:var(--red)}
.ss-opt[aria-selected="true"]{background:var(--red);color:var(--red-ink);box-shadow:var(--shadow-red)}
.ss-opt[aria-selected="true"] small{color:inherit;opacity:.8}
.ss-opt[disabled]{opacity:.32;pointer-events:none}
.ss-empty{padding:28px 10px;text-align:center;font-size:13.5px;color:var(--ink-3)}
.fsec{display:flex;flex-direction:column;gap:14px}
.fsec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.fsec-h h3{font-size:20px}
.fsec-h p,.fsec-h a{font-size:13.5px;color:var(--ink-2)}
.fsec-h a{color:var(--red);font-weight:500;text-decoration:none;cursor:pointer}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bgrid .full{grid-column:1/-1}
.bgrid3{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.nb-sum{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:20px;background:var(--surface);font-size:14.5px}
.nb-sum b{font-weight:500}
.nb-sum.bad{background:var(--red-tint);color:var(--red)}
.tabs{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--surface) 70%,transparent);margin-bottom:26px}
.tabs a{padding:9px 18px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:14.5px}
.tabs a[aria-current="page"]{background:var(--raise);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 16px -10px rgba(0,0,0,.25)}
.chero{display:flex;gap:24px;align-items:center;padding:30px 34px;border-radius:40px;margin-bottom:28px}
.chero .tok{border-radius:50%}
.chero h1{font-size:clamp(30px,3.6vw,44px)}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.svc label{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:24px;background:var(--glass-strong);border:1px solid var(--glass-line);cursor:pointer;transition:all .2s}
.svc input{position:absolute;opacity:0}
.svc .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent}
.svc input:checked ~ .tick{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.svc label:has(input:checked){border-color:var(--red-mid);background:var(--red-tint)}

  if(remaining<=0) return;
  if(!list.length){ req.status='stalled'; logR(req,`No more eligible donors within ${req.radius} km`); return; }
  const maxW=req.kind==='planned'?8:S.rules.maxWaves;
  if(req.wave>=maxW){ req.status='stalled'; logR(req,`Stopped after ${maxW} rounds`); return; }
  const size=req.kind==='planned'? remaining : Math.max(3,Math.ceil(remaining*S.rules.perUnit));
  const pick=list.slice(0,size);
  req.wave++;
  const t=now();
  const speed = req.priority==='critical'?0.7:1;
  for(const d of pick){
    const rel=(d.stats.yes+1)/(d.stats.asked+2);
    const roll=Math.random();
    const reply = req.kind==='planned' ? (roll<0.5+rel*0.3?'yes':roll<0.88?'no':'silent') : (roll < 0.22+rel*0.38 ? 'yes' : roll < 0.78 ? 'no' : 'silent');
    const seen=t+rand(1.5,6)*MIN*speed;
    req.invites.push({ donorId:d.id, wave:req.wave, status:'sent', sentAt:t,
      _seenAt:seen, _reply:reply, _replyAt: reply==='silent'?null: seen+rand(2,11)*MIN*speed,
      eta: req.kind==='planned'?'Booked for '+shortDay(req.neededBy) : req.kind==='topup'?'Donating '+['today','tomorrow','this week'][Math.floor(Math.random()*3)] : ['Within 1 hour','Within 1 hour','1–2 hours','2–3 hours'][Math.floor(Math.random()*4)] });
    d.asks.push(t); d.stats.asked++;
  }
  req.status='finding';
  req.waveDeadline=t+(req.kind==='planned'?S.rules.circleReplyMin:S.rules.timeoutMin)*MIN*(req.priority==='critical'?0.75:1);
  if(req.kind==='planned'){ const P=patientOf(req); const out=pick.filter(d=>!P.circle.includes(d.id));
    logR(req, out.length? `No one in ${first(P.name)}'s circle is ready. Asked ${pick.map(d=>first(d.name)).join(', ')} from the wider pool` : `Asked ${pick.map(d=>first(d.name)).join(', ')} from ${first(P.name)}'s circle`);
    if(out.length) P.needsDonors=true; }
  else logR(req,`Wave ${req.wave} sent to ${pick.length} donor${pick.length===1?'':'s'}`);
}
function startRequest(req){
  if(req.priority!=='critical' && isQuiet()){ req.status='queued'; logR(req,`Queued for ${S.rules.quietEnd}:00 am. Quiet hours are on.`); return; }
  sendWave(req);
}
function checkCoverage(req){
  if(req.status==='finding' && committed(req)>=req.units){
    req.status='covered';
    let n=0; req.invites.forEach(v=>{ if(v.status==='sent'||v.status==='seen'){ v.status='standdown'; v.at=now(); n++; } });
    logR(req, req.kind==='planned'? `Donor booked for every unit` : `All ${req.units} unit${req.units>1?'s':''} covered.${n?` ${n} donor${n>1?'s were':' was'} told they're not needed.`:''}`);
    toast(req.kind==='planned'? `${esc(first(patientOf(req).name))}'s transfusion has a donor booked` : `${g(req.group)} ${COMP[req.comp].short.toLowerCase()} is covered`,'ok');
  }
  if(['finding','covered'].includes(req.status) && donatedN(req)>=req.units){
    req.status='done'; req.closedAt=now();
    if(req.kind==='planned'){ const P=patientOf(req); logR(req,`Blood ready for ${first(P.name)}'s transfusion`); if(P.nextAt===req.transfusionAt){ P.history.push(req.transfusionAt); P.nextAt=req.transfusionAt+P.interval*DAY; } toast(`Blood ready for ${esc(first(P.name))}. Next transfusion scheduled.`,'ok'); }
    else { logR(req,'Request completed'); toast('Request completed. Thank-you messages sent.','ok'); }
  }
}
let flashIds=new Set();
function tick(){
  let changed=false; const t=now();
  /* quiet hours over: send queued */
  if(!isQuiet()) S.requests.forEach(q=>{ if(q.status==='queued'){ logR(q,'Quiet hours over. Sending now'); sendWave(q); changed=true; } });
  /* open bookings for transfusions in the next week */
  (S.patients||[]).forEach(p=>{ if(!p.active) return; if(p.nextAt-t<=S.rules.bookAheadDays*DAY && !bookingFor(p)){ const q=newPlanned(p); S.requests.push(q); startRequest(q); changed=true; } });
  /* stock: offers accepted, expired units */
  (S.stock||[]).forEach(u=>{
    if(u.status==='offered' && t>=u.acceptAt){ u.status='transferred'; u.at=t; S.stockStats.savedThisMonth++; const c=S.network.find(x=>x.id===u.offerTo); c.needs=c.needs.filter(([gp,cp])=>!(gp===u.group&&cp===u.comp)); toast(`${esc(c.name)} accepted ${g(u.group)} ${COMP[u.comp].short.toLowerCase()}. Arrange transport.`,'ok'); changed=true; }
    if(['stock','usefirst','offered'].includes(u.status) && t>=u.expiresAt){ u.status='expired'; u.at=t; S.stockStats.expiredThisMonth++; changed=true; } });
  for(const req of S.requests){
    if(!['finding','covered'].includes(req.status)) continue;
    for(const v of req.invites){
      const d=S.donors.find(x=>x.id===v.donorId); if(!d) continue;
      if(v.status==='sent' && v._seenAt && t>=v._seenAt){ v.status='seen'; changed=true; }
      if((v.status==='seen'||v.status==='sent') && v._replyAt && t>=v._replyAt){
        if(v._reply==='yes'){
          if(committed(req)>=req.units){ v.status='standdown'; }
          else { v.status='yes'; v.at=t; d.stats.yes++; v._otwAt= req.kind==='urgent'||!req.kind ? t+rand(5,14)*MIN : null; flashIds.add(req.id+v.donorId);
                 if(req.kind==='planned'){ const P=patientOf(req); P.rot=(P.circle.indexOf(d.id)+1)||P.rot+1; toast(`${esc(first(d.name))} is booked for ${esc(first(P.name))}'s transfusion`,'ok'); }
                 else toast(`${esc(first(d.name))} said yes for ${g(req.group)} ${COMP[req.comp].short.toLowerCase()}`,'ok'); }
        } else {
          v.status='no'; v.at=t; d.lastNoAt=t; v.reason=NO_REASONS[Math.floor(Math.random()*NO_REASONS.length)];
          if(v.reason==='Donated elsewhere recently'){ d.lastDonated=t-18*DAY; }
        }
        changed=true; checkCoverage(req);
      }
      if(v.status==='yes' && v._otwAt && t>=v._otwAt){ v.status='ontheway'; v.at=t; changed=true; }
    }
    if(req.status==='finding' && !req.invites.some(v=>v.status==='sent'||v.status==='seen') && committed(req)<req.units && req.waveDeadline-t>2*MIN){ req.waveDeadline=t+2*MIN; changed=true; }
    if(req.status==='finding' && req.waveDeadline && t>=req.waveDeadline){
      req.invites.forEach(v=>{ if((v.status==='sent'||v.status==='seen') && v.wave===req.wave){ v.status='silent'; v.at=t; } });
      sendWave(req); changed=true;
    }
  }
  if(changed){ save(); }
  if(changed || ['request','today','bookings','requests'].includes(route().view)) softRender(changed);
}
function act(req,donorId,what){
  const v=req.invites.find(x=>x.donorId===donorId); const d=S.donors.find(x=>x.id===donorId); if(!v||!d) return;
  if(what==='arrived'){ v.status='arrived'; v.at=now(); }
  if(what==='donated'){ v.status='donated'; v.at=now(); d.lastDonated=now(); d.donations++; d.stats.showed++;
    toast(`${esc(first(d.name))}'s donation recorded. Thank-you message sent.`,'ok'); }
  if(what==='deferred'||what==='noshow'){
    v.status=what; v.at=now();
    logR(req, what==='deferred'?`${first(d.name)} was deferred at screening`:`${first(d.name)} didn't come. Slot released.`);
    if(req.status==='covered'){ req.status='finding'; logR(req,'Need reopened'); sendWave(req); }
    else if(req.status==='finding' && !req.invites.some(x=>['sent','seen'].includes(x.status))) sendWave(req);
  }
  checkCoverage(req); save(); render();
}

function reqStatus(req){

}
function slots(req,lg){

function reqCard(req){

const WORDS=['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
const word=(n,lower)=>{ const w=n<=10?WORDS[n]:String(n); return lower?w.toLowerCase():w; };
function hashStr(t){ let h=7; for(const c of t) h=(h*31+c.charCodeAt(0))>>>0; return h; }

/* signal map: centre in the middle, donors placed by distance, coloured by reply */
function radar(req){
  const cx=200, cy=200, R=172, maxKm=Math.max(req.radius,15);
  const rings=[5,10,15,30,40].filter(k=>k<=maxKm);
  const pos=d=>{ const a=(hashStr(d.id)%360)*Math.PI/180; const r=Math.max(36, Math.sqrt(Math.min(1,donorKm(d,reqLoc(req))/maxKm))*R); return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  const cls={sent:'w',seen:'w',yes:'y',ontheway:'y',arrived:'a',donated:'d'};
  let dots='';
  const order=['no','silent','standdown','deferred','noshow','cancelled','sent','seen','yes','ontheway','arrived','donated'];
  req.invites.slice().sort((a,b)=>order.indexOf(a.status)-order.indexOf(b.status)).forEach(v=>{
    const d=S.donors.find(x=>x.id===v.donorId); if(!d) return; const [x,y]=pos(d); const c=cls[v.status]||'o';
    const halo = (c==='y'||c==='a'||c==='d') ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="15" class="${c}h"/>` : '';
    const r = c==='o'?3.5 : c==='w'?5.5 : 7.5;
    dots+=`<g class="dot" data-act="chat" data-r="${req.id}" data-d="${d.id}"><title>${esc(d.name)}, ${donorKm(d,reqLoc(req))} km</title>${halo}<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" class="${c}"/></g>`;
  });
  const live=req.status==='finding';
  const pulses= live? [0,1,2].map(i=>`<circle class="pulse" data-sync="3600" data-off="${i*1200}" cx="${cx}" cy="${cy}" r="${R}"/>`).join('') : '';
  const radiusRing = req.radius<maxKm? '' : '';
  return `<svg class="radar" viewBox="0 0 400 418" role="img" aria-label="Map of ${req.invites.length} donors messaged around the centre">
    ${rings.map(k=>{ const rr=Math.sqrt(k/maxKm)*R; return `<circle class="ring ${k>req.radius?'dash':''}" cx="${cx}" cy="${cy}" r="${rr.toFixed(1)}"/><text class="rl" text-anchor="middle" x="${cx}" y="${(cy+rr+14).toFixed(1)}">${k} km</text>`; }).join('')}
    ${pulses}${radiusRing}
    <circle class="core-h" cx="${cx}" cy="${cy}" r="30"/><circle class="core" cx="${cx}" cy="${cy}" r="19"/>
    <path d="M200 189.5s6.6 7.1 6.6 11.9a6.6 6.6 0 0 1-13.2 0c0-4.8 6.6-11.9 6.6-11.9z" fill="var(--red-ink)"/>
    ${dots}</svg>`;
}

function hoursLeft(u){ const h=Math.max(0,Math.round((u.expiresAt-now())/3600e3)); if(h<24) return `${h} h`; const dd=Math.round(h/24); return dd===1?'1 day':`${dd} days`; }

}

    <section><div class="sh"><h2>Coming up this week</h2><a href="#/patients">All patients</a></div>
      <div class="panel card">${wk.length?wk.map(({p,at,b})=>`<a class="rrow" href="#/patient/${p.id}">${dblock(at)}

        <div class="end"><div class="tok xs">${g(p.group)}</div>${bookingTag(p,at,b)}<span class="chev">${ic('chev',18)}</span></div></a>`).join(''):`<p class="muted" style="padding:18px 14px">No transfusions in the next 7 days.</p>`}</div></section>
    <section><div class="sh"><h2>Expiring soon</h2><a href="#/stock">All stock</a></div>
      <div class="panel card">${exp.length?exp.slice(0,5).map(u=>unitRow(u,true)).join(''):`<p class="muted" style="padding:18px 14px">Nothing expires in the next 3 days.</p>`}</div></section>
  </div>
  ${urgent.length?`<section class="block"><div class="sh"><h2>Urgent requests and top-ups</h2><a href="#/bookings">All bookings</a></div>${reqList(urgent)}</section>`:''}`;

const QUICK_WHEN=[['2h','In 2 hours',2],['4h','In 4 hours',4],['6h','In 6 hours',6],['tonight','Tonight, 9 pm'],['tomorrow','Tomorrow, 9 am']];
function quickWhen(k){
  const q=QUICK_WHEN.find(x=>x[0]===k); if(q&&q[2]) return roundSlot(now()+q[2]*3600e3).getTime();
  const d=new Date(); if(k==='tonight'){ d.setHours(21,0,0,0); if(d<=new Date()) d.setDate(d.getDate()+1); } else { d.setDate(d.getDate()+1); d.setHours(9,0,0,0); }
  return d.getTime();
}
function quickComposer(){

    <div class="quick-h"><div><h2>Urgent request</h2><p class="small muted">For needs you didn’t plan for. Eligible donors near ${esc(S.bank.area||S.bank.district)} get a WhatsApp message right away.</p></div>
      <span class="pill red live"><span class="dot"></span>WhatsApp ready</span></div>
    <div class="quick-grid">
      <fieldset class="qf"><legend class="qlbl">Blood group</legend>
        <div class="gtiles">${(()=>{ const pool=poolData(); return GROUPS.map(x=>`<label class="gtile ${pool[x]<3?'low':''}"><input type="radio" name="group" value="${x}"><span class="gt-in"><span class="gt-g">${g(x)}</span><span class="gt-n">${pool[x]} nearby</span></span></label>`).join(''); })()}</div>
      </fieldset>
      <div class="qside">
        <fieldset class="qf"><legend class="qlbl">Component</legend>
          <div class="seg">${Object.entries(COMP).filter(([k])=>S.bank.services[k]).map(([k,c])=>`<label><input type="radio" name="comp" value="${k}" ${k===firstComp()?'checked':''}><span>${c.short}</span></label>`).join('')}</div></fieldset>
        <fieldset class="qf"><legend class="qlbl">Needed by</legend>
          <div class="seg seg2">${QUICK_WHEN.map(([k,l],i)=>`<label><input type="radio" name="when" value="${k}" ${i===2?'checked':''}><span><b>${({'2h':'2 hours','4h':'4 hours','6h':'6 hours','tonight':'Tonight','tomorrow':'Tomorrow'})[k]}</b><small data-when-sub="${k}">${fmtTime(quickWhen(k))}</small></span></label>`).join('')}</div></fieldset>
        <fieldset class="qf"><legend class="qlbl">Units</legend>
          <div class="units"><div class="stepper" aria-label="Units"><button type="button" data-act="step" data-n="-1" aria-label="One fewer unit">−</button><output>1</output><button type="button" data-act="step" data-n="1" aria-label="One more unit">+</button><input type="hidden" name="units" value="1"></div>
          <div class="slots" id="q-slots" aria-hidden="true"><span class="slot c">${ic('drop',12,true)}</span></div></div></fieldset>
      </div>
    </div>
    <div class="quick-f">
      <div class="grow"><div class="q-sum" id="q-sum">Choose a blood group to begin.</div><div class="small muted" id="q-preview">Bloodo checks eligibility, distance and rest days before messaging anyone.</div></div>
      <button type="button" class="btn ghost" data-act="quick-more">More options</button>
      <button class="btn primary xl" id="q-go" disabled>${ic('send',18)}Find donors</button>
    </div>
    <p class="err-t" data-err hidden></p>
  </form>`;
}
function updateQuick(){
  const form=document.querySelector('[data-form="quick-request"]'); if(!form) return;
  const f=new FormData(form); const group=f.get('group'), comp=f.get('comp'), units=+f.get('units'), when=f.get('when');
  const box=$('#q-preview'), sum=$('#q-sum'), go=$('#q-go');
  form.querySelectorAll('[data-when-sub]').forEach(el=>el.textContent=fmtTime(quickWhen(el.dataset.whenSub)));
  $('#q-slots').innerHTML=Array.from({length:units},()=>`<span class="slot c">${ic('drop',12,true)}</span>`).join('');
  go.disabled=!group;
  form.querySelectorAll('.gtile').forEach(t=>{ const x=t.querySelector('input').value; const n=candidates({group:x,comp,units:1,radius:S.rules.radiusKm,invites:[],loc:bankLoc()}).list.length;
    t.querySelector('.gt-n').textContent=`${n} nearby`; t.classList.toggle('low',n<3); });
  if(!group){ sum.textContent='Choose a blood group to begin.'; box.textContent='Bloodo checks eligibility, distance and rest days before messaging anyone.'; return; }
  sum.innerHTML=`${word(units)} unit${units>1?'s':''} of <em>${g(group)} ${esc(COMP[comp].short.toLowerCase())}</em>, by ${fmtWhen(quickWhen(when))}`;
  const {list}=candidates({group,comp,units,radius:S.rules.radiusKm,invites:[],loc:bankLoc()});
  const first=Math.min(list.length,Math.max(3,Math.ceil(units*S.rules.perUnit)));
  const quiet=isQuiet();
  box.innerHTML= list.length? `<span style="color:var(--ok);font-weight:500">${list.length} donor${list.length>1?'s':''} ready within ${S.rules.radiusKm} km.</span> The first wave goes to ${first}.${quiet?' Quiet hours are on, so it sends at 7 am unless you mark it critical.':''}`
    : `<span style="color:var(--warn);font-weight:500">No ready donors within ${S.rules.radiusKm} km.</span> You can still start it and widen the search.`;
}
function inviteTag(v){
  const m={sent:['','Delivered'],seen:['','Seen'],yes:['ok', v.eta&&/^(Booked|Donating)/.test(v.eta)? v.eta : `Coming ${v.eta?v.eta.toLowerCase():''}`],ontheway:['ok','On the way'],arrived:['calm','At the centre'],
    donated:['red','Donated'],no:['','Not now'],silent:['','No reply'],standdown:['','Not needed'],deferred:['warn','Deferred'],noshow:['warn',"Didn't come"],cancelled:['','Cancelled']}[v.status];
  return `<span class="pill ${m[0]}">${m[1]}</span>`;
}

  <div id="bookings-live">${bookingsLive()}</div>`;
}
function bookingsLive(){
  const f=UI.reqFilter; const okF=q=> f==='all' || (f==='active' ? ['finding','covered','queued','stalled'].includes(q.status) : ['done','cancelled'].includes(q.status));
  const sec=(kind,title,empty)=>{ const l=S.requests.filter(q=>(q.kind||'urgent')===kind && okF(q)).sort((a,b)=>a.neededBy-b.neededBy); return `<section class="block" style="margin-top:30px"><div class="sh"><h2>${title}</h2><p>${l.length||''}</p></div>${l.length?reqList(l):`<p class="muted" style="padding:0 4px">${empty}</p>`}</section>`; };
  return `<div class="toolbar"><div class="chips">${[['active','Open'],['closed','Closed'],['all','All']].map(([k,l])=>`<button class="chip" aria-pressed="${f===k}" data-act="req-filter" data-f="${k}">${l}</button>`).join('')}</div></div>
    ${sec('planned','Planned transfusions','Bookings open automatically 7 days before each transfusion.')}
    ${sec('topup','Stock top-ups','Start a top-up from the Stock page when a group is running short.')}
    ${sec('urgent','Urgent requests','No urgent requests.')}`;
}

/* ---------- Request board ---------- */
function waMessage(req,km){
  const G=req.group.replace('-','−'), L=reqLoc(req).name;
  if(req.kind==='planned') return `🩸 *Your donor circle: ${G} needed*\nA child you help regularly has a transfusion on ${shortDay(req.transfusionAt)}.\nCan you donate at ${L} by ${fmtWhen(req.neededBy)}?`;
  if(req.kind==='topup') return `🩸 *${G} donors needed this week*\n${L} expects to run short of ${G} soon, ${km?km+' km':'near'} from you.\nCan you donate by ${fmtWhen(req.neededBy)}?`;
  return `🩸 *${COMP[req.comp].short} needed: ${req.group.replace('-','−')}*\n${reqLoc(req).name}, ${km?km+' km':'near'} from you\nNeeded by ${fmtWhen(req.neededBy)}\n\nCan you donate?`;
}
function vRequest(id){
  const req=S.requests.find(q=>q.id===id);
  if(!req) return `<a class="back" href="#/bookings">${ic('back',16)}Bookings</a><div class="card empty"><h3>Booking not found</h3><p class="muted">It may have been removed. Go back to see all bookings.</p></div>`;
  const by=st=>req.invites.filter(v=>st.includes(v.status));
  const coming=by(['yes','ontheway','arrived']), waiting=by(['sent','seen']), donated=by(['donated']), out=by(['no','silent','standdown','deferred','noshow','cancelled']);
  const c=committed(req);
  let band='';
  if(req.status==='finding'){
    const total=S.rules.timeoutMin*MIN*(req.priority==='critical'?0.75:1);
    const left=Math.max(0,req.waveDeadline-now()); const pct=Math.min(100,100-left/total*100);

      <div class="track" aria-hidden="true"><i style="width:${pct2}%"></i></div>
      <button class="btn ghost sm" data-act="next-wave" data-id="${req.id}">${ic('rotate',15)}Ask next in circle</button></div>` : `<div class="wave"><div><div class="mid">Wave ${req.wave} of up to ${S.rules.maxWaves}</div><div class="small muted">${waiting.length} waiting for a reply. Next wave in ${mins} min if still short.</div></div>
      <div class="track" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <button class="btn ghost sm" data-act="next-wave" data-id="${req.id}">${ic('send',15)}Send next wave now</button></div>`;
  } else if(req.status==='covered'){
    band=`<div class="wave" style="background:var(--ok-bg)"><div class="row" style="color:var(--ok)">${ic('check',20)}<div><div class="mid">${req.kind==='planned'?'Donor booked':'All units covered'}</div><div class="small" style="color:var(--ink-2)">${req.kind==='planned'?`Mark the donor as arrived and donated on ${shortDay(req.neededBy)}. The family doesn’t need to arrange anyone.`:'Mark each donor as they arrive and donate.'}</div></div></div></div>`;
  } else if(req.status==='stalled' && req.kind==='planned'){
    band=`<div class="wave" style="background:var(--warn-bg)"><div><div class="mid" style="color:var(--warn)">No one in the circle can donate in time</div><div class="small muted">Add donors to ${esc(first(patientOf(req).name))}’s circle, or ask the wider pool nearby.</div></div>
      <div class="row wrapflex" style="gap:8px"><a class="btn primary sm" href="#/patient/${req.patientId}">Add to circle</a><button class="btn ghost sm" data-act="widen" data-id="${req.id}">Ask wider pool</button></div></div>`;
  } else if(req.status==='stalled'){
    band=`<div class="wave" style="background:var(--warn-bg)"><div><div class="mid" style="color:var(--warn)">No more eligible donors within ${req.radius} km</div><div class="small muted">Widen the search, or call nearby blood centres for this unit.</div></div>
      <div class="row wrapflex" style="gap:8px">${req.radius<40?`<button class="btn primary sm" data-act="widen" data-id="${req.id}">Search up to ${req.radius<30?30:40} km</button>`:''}<button class="btn ghost sm" data-act="cancel-req" data-id="${req.id}">Cancel request</button></div></div>`;
  } else if(req.status==='queued'){
    band=`<div class="wave" style="background:var(--calm-bg)"><div><div class="mid" style="color:var(--calm)">Quiet hours are on</div><div class="small muted">Messages go out at ${S.rules.quietEnd}:00 am. Mark this as critical to send now.</div></div>
      <button class="btn primary sm" data-act="send-critical" data-id="${req.id}">${ic('send',15)}Send now as critical</button></div>`;
  } else if(req.status==='done'){

  } else if(req.status==='cancelled'){
    band=`<div class="wave"><div class="mid">Cancelled ${req.closedAt?fmtWhen(req.closedAt):''}. Donors who were waiting were told it's no longer needed.</div></div>`;
  }
  const sk=req.skipped||{}; const skRows=[['recovering','Still recovering from their last donation'],['resting','Asked recently or said "not now"'],['locked','Already on another request'],['paused','Paused their alerts'],['noApheresis','Not registered for platelet donation'],['far',`Further than ${req.radius} km`]].filter(([k])=>sk[k]);
  const P=patientOf(req);
  const title = req.kind==='planned' ? `${esc(first(P.name))}’s transfusion,<br><em>${new Date(req.transfusionAt).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'})}.</em>`

    : `${g(req.group)} ${esc(COMP[req.comp].short.toLowerCase())},<br><em>${word(req.units,true)} unit${req.units>1?'s':''}.</em>`;

    : req.kind==='topup' ? `Topping up ${g(req.group)} ${esc(COMP[req.comp].short.toLowerCase())} before stock runs short. Donors are booked to give by ${fmtWhen(req.neededBy)}.`
    : `Needed by ${fmtWhen(req.neededBy)}${['finding','covered','queued','stalled'].includes(req.status)?` (${until(req.neededBy)})`:''}${req.ref?`, for ${esc(req.ref)}`:''}.`;
  return `<a class="back" href="#/bookings">${ic('back',16)}Bookings</a>
  <section class="rhero glass">
    <div>
      <div class="row wrapflex" style="gap:8px;margin-bottom:16px">${reqStatus(req)}${req.priority!=='routine'?`<span class="pill ${req.priority==='critical'?'red':'warn'}">${PRIORITY[req.priority]}</span>`:''}</div>

      <div class="conf">${slots(req,true)}<span class="muted">${c} of ${req.units} confirmed${donatedN(req)?`, ${donatedN(req)} donated`:''}</span></div>
      ${band}

      ${donated.length?lane('Donated',donated,req):''}
      ${out.length?`<details class="fold lane" id="fold-${req.id}"><summary><span class="chev">${ic('chev',16)}</span><h3 style="font-size:18px">Not coming</h3><span class="small faint">${out.length}</span></summary>
        <div class="card quiet-list" style="padding:4px 18px;margin-top:10px"><div class="rows">${out.map(v=>{const d=S.donors.find(x=>x.id===v.donorId); return `<div class="rowi"><div class="tok xs quiet">${g(d.group)}</div><div class="grow"><div class="ellip">${esc(d.name)}</div><div class="small muted">${v.status==='no'&&v.reason?esc(v.reason):v.status==='silent'?'No reminder sent':v.status==='standdown'?'Told the request is covered':''}</div></div>${inviteTag(v)}<button class="iconbtn" style="width:34px;height:34px" data-act="chat" data-r="${req.id}" data-d="${d.id}" aria-label="View WhatsApp chat with ${esc(d.name)}">${ic('chat',15)}</button></div>`}).join('')}</div></div></details>`:''}
    </div>
    <aside class="stack" style="gap:18px;margin-top:26px">

function lane(title,list,req,emptyText){
  return `<section class="lane"><div class="lane-h"><h3>${title}</h3><span class="n">${list.length}</span></div>
    ${list.length?`<div class="dcards">${list.map(v=>dcard(v,req)).join('')}</div>`: emptyText?`<p class="small muted">${emptyText}</p>`:''}</section>`;
}
function dcard(v,req){
  const d=S.donors.find(x=>x.id===v.donorId);
  let acts='';
  if(v.status==='yes'||v.status==='ontheway') acts=`<button class="btn primary sm" data-act="inv" data-w="arrived" data-r="${req.id}" data-d="${d.id}">Mark arrived</button><button class="btn ghost sm" data-act="inv" data-w="noshow" data-r="${req.id}" data-d="${d.id}">Didn't come</button>`;
  if(v.status==='arrived') acts=`<button class="btn ok sm" data-act="inv" data-w="donated" data-r="${req.id}" data-d="${d.id}">${ic('check',15)}Donated</button><button class="btn ghost sm" data-act="inv" data-w="deferred" data-r="${req.id}" data-d="${d.id}">Deferred</button>`;
  const when = v.status==='sent'?`Sent ${ago(v.sentAt)}`: v.status==='seen'?'Read the message': v.status==='donated'?`Donated ${fmtTime(v.at)}`: v.at?`Updated ${ago(v.at)}`:'';
  return `<div class="dc" data-flash="${req.id+d.id}">
    <div class="top"><div class="tok sm ${d.group===req.group?'':'quiet'}">${g(d.group)}</div>
      <div class="grow"><div class="name ellip">${esc(d.name)}</div><div class="sub">${donorKm(d,reqLoc(req))} km, ${esc(d.city)}</div></div>

      ${['yes','ontheway','arrived'].includes(v.status)?`<button class="iconbtn" style="width:34px;height:34px" data-act="call" data-d="${d.id}" aria-label="Call ${esc(d.name)} on a masked line">${ic('phone',15)}</button>`:''}</div>
    <div class="row between"><div class="row" style="gap:8px">${inviteTag(v)}</div><span class="small faint" style="white-space:nowrap">${when}</span></div>
    <div class="small muted">${reliabilityText(d)}${d.donations?`. ${d.donations} donation${d.donations>1?'s':''}`:''}</div>
    ${acts?`<div class="acts">${acts}</div>`:''}
  </div>`;
}
function chatFor(req,v,d){
  const b=[]; const t=v.sentAt; const fn=first(d.name);
  const out=(x,tm)=>b.push(`<div class="bub out">${x}<span class="t">${fmtTime(tm)}</span></div>`);
  const inn=(x,tm)=>b.push(`<div class="bub in">${x}<span class="t">${fmtTime(tm)}</span></div>`);
  out(esc(waMessage(req,donorKm(d,reqLoc(req)))).replace(/\*(.+?)\*/g,'<b>$1</b>'),t);
  b.push(`<div class="bub-btns"><span>Yes, I can</span><span>Not now</span><span>Pause alerts</span></div>`);
  if(v.status==='sent'){ b.push(`<div class="note">Delivered</div>`); }
  if(v.status==='seen') b.push(`<div class="note">Read</div>`);
  const at=v.at||t;
  if(['yes','ontheway','arrived','donated','deferred','noshow'].includes(v.status)){
    if(req.kind==='planned'||req.kind==='topup'){ inn('Yes, I can',at); out(`Thank you, ${esc(fn)}! You’re booked for ${esc(fmtWhen(req.neededBy))}. We’ll remind you the day before.`,at); }
    else { inn('Yes, I can',at); out(`Thank you, ${esc(fn)}! When can you reach the centre?`,at); inn(esc(v.eta||'Within 1 hour'),at); }
    out(`📍 ${esc(reqLoc(req).name)}, ${esc(reqLoc(req).area||reqLoc(req).district)}\nBefore you come: eat a light meal, drink water, and bring a photo ID.`,at);
  }
  if(['ontheway','arrived','donated','deferred'].includes(v.status) && req.kind!=='planned') inn("I'm on my way",at);
  if(['arrived','donated','deferred'].includes(v.status)) out('Welcome! Show this message at the registration desk.',at);
  if(v.status==='donated' && req.kind==='planned') out(`Thank you, ${esc(fn)}. Your blood is ready for a child’s transfusion on ${shortDay(req.transfusionAt)}. You can donate again from ${fmtDate(now()+recoveryDays(d)*DAY)}.`,at);
  else if(v.status==='donated') out(`You did it, ${esc(fn)}. Your donation reaches a patient today. You can donate again from ${fmtDate(now()+recoveryDays(d)*DAY)}, and we'll remind you.`,at);
  if(v.status==='deferred') out(`Thank you for coming in, ${esc(fn)}. The team couldn't take a donation today and will explain why. We'll check in before asking again.`,at);
  if(v.status==='noshow') out(`Looks like today didn't work out. No problem, we've released your slot.`,at);
  if(v.status==='no'){ inn('Not now',at); out('No problem. Can you tell us why? (optional)',at); if(v.reason) inn(esc(v.reason),at); out(`Thanks for letting us know. We won't ask again for ${S.rules.restAfterNo} days.`,at); }
  if(v.status==='silent') b.push(`<div class="note">No reply. Bloodo doesn't send reminders.</div>`);
  if(v.status==='standdown') out(`Update: this request is now covered. Thank you for being ready, ${esc(fn)}. You'll be first in line next time.`,at);
  if(v.status==='cancelled') out(`Update: this request is no longer needed. Thank you, ${esc(fn)}.`,at);
  return b.join('');
}

function forecast(){
  const end=now()+14*DAY;
  return GROUPS.map(gp=>{
    const inStock=S.stock.filter(u=>u.group===gp&&u.comp==='rbc'&&['stock','usefirst'].includes(u.status)&&u.expiresAt>now()+2*DAY).length;
    const sched=upcoming(14).filter(x=>x.p.group===gp && !(x.b&&['covered','done'].includes(x.b.status))).reduce((n,x)=>n+x.p.units,0);
    const usual=Math.round((S.usage[gp]||0)*14);
    const incoming=S.requests.filter(q=>q.kind==='topup'&&q.group===gp&&['finding','covered'].includes(q.status)).reduce((n,q)=>n+committed(q),0);
    const need=sched+usual, gap=need-inStock-incoming;
    return {gp,inStock,sched,usual,need,incoming,gap,surplus:inStock>need*1.8&&inStock-need>4};
  });
}

function filteredDonors(){

function readDonor(form,o={}){
  const f=new FormData(form); const v=k=>(f.get(k)||'').toString().trim();
  const phone=cleanPhone(v('phone'),'mobile');
  const errs=[];
  if(v('name').length<2) errs.push(['name','Enter the donor\'s full name.']);
  if(!/^[6-9]\d{9}$/.test(phone)) errs.push(['phone','Enter a 10-digit Indian mobile number.']);
  const dupe=S.donors.find(d=>d.phone===phone); if(dupe) errs.push(['phone',`This number is already registered to ${dupe.name}.`]);
  const age=ageFrom(v('dob')); if(age===null) errs.push(['dob','Enter the date of birth.']); else if(age<18) errs.push(['dob',`Not eligible: donors must be 18 or older (this person is ${age}).`]); else if(age>65) errs.push(['dob','Donors above 65 need the medical officer\'s approval first.']);
  if(!v('group')) errs.push(['group','Choose a blood group.']);
  if(!o.district && !v('district')) errs.push(['district','Choose a district.']);
  let last=null; if(v('lastMode')==='date'){ if(!v('lastDate')) errs.push(['lastDate','Pick the last donation date, or choose "Never donated".']); else last=new Date(v('lastDate')).getTime(); }
  if(v('pin') && !validPin(v('pin'))) errs.push(['pin','Enter a 6-digit PIN code that doesn’t start with 0.']);
  if(v('lastMode')==='date' && v('lastDate') && v('dob') && ageFrom(v('dob'))!==null){ const at=new Date(v('lastDate')); const b=new Date(v('dob')); b.setFullYear(b.getFullYear()+18); if(at<b) errs.push(['lastDate','The last donation can’t be before the donor turned 18.']); }
  if(!f.get('consent')) errs.push(['consent','Bloodo can only message donors who agreed.']);
  form.querySelectorAll('.err').forEach(e=>e.classList.remove('err'));
  const box=form.querySelector('[data-err]');
  if(errs.length){ const f0=errs.map(([k])=>markErr(form,k))[0]; box.hidden=false; box.textContent=errs.map(e=>e[1]).join(' '); f0&&f0.focus&&f0.focus(); return null; }
  const pin=v('pin'); const km= pin? +(1+(Math.abs(parseInt(pin,10)-600003)%220)/10).toFixed(1) : +(2+Math.random()*12).toFixed(1);
  return { id:uid('d'), name:v('name').replace(/\s+/g,' '), phone, email:v('email'), dob:v('dob'), gender:v('gender')||'Male', group:v('group'),
    state:o.state||v('state')||S.bank.state, district:o.district||v('district')||S.bank.district, city:v('city')||S.bank.district,
    km, apheresis:!!f.get('apheresis'), consent:true, source:o.source||v('source')||'walk-in', addedAt:now(),
    lastDonated:last, donations:last?1:0, pausedUntil:null, lastNoAt:null, asks:[], stats:{asked:0,yes:0,showed:0} };
}

function neededByFrom(f){ const d=f.get('nbDate'), t=f.get('nbTime'); return d&&t? new Date(`${d}T${t}`).getTime() : null; }
function dateOpts(){ const out=[]; const d=new Date(); d.setHours(0,0,0,0);
  for(let i=0;i<14;i++){ const x=new Date(d); x.setDate(d.getDate()+i); const lab=`${x.toLocaleDateString('en-IN',{weekday:'short'})} ${x.getDate()} ${x.toLocaleDateString('en-IN',{month:'short'})}`;
    out.push({v:ymd(x),l:i===0?`Today, ${lab}`:i===1?`Tomorrow, ${lab}`:lab}); } return out; }
function timeOpts(day){ const today=day===ymd(new Date()); const nowM=new Date().getHours()*60+new Date().getMinutes();
  return HOURS.map(o=>{ const [h,m]=o.v.split(':').map(Number); return {...o,dis: today && h*60+m<=nowM}; }); }
function roundSlot(ts){ const d=new Date(ts); d.setSeconds(0,0); const m=d.getMinutes(); d.setMinutes(m===0||m===30?m:(m<30?30:60)); return d; }
