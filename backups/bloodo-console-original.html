  if(oss){
    if(e.key==='Escape'){ e.preventDefault(); closeAllSS(); oss.querySelector('.ss-btn').focus(); return; }
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); const opts=[...oss.querySelectorAll('.ss-opt:not([hidden]):not([disabled])')]; if(!opts.length) return;
      let i=opts.findIndex(o=>o.classList.contains('hl')); i = e.key==='ArrowDown'? Math.min(opts.length-1,i+1) : Math.max(0,i-1);
      opts.forEach(o=>o.classList.remove('hl')); opts[i].classList.add('hl'); opts[i].scrollIntoView({block:'nearest'}); if(!oss.querySelector('[data-ss-search]')) opts[i].focus(); return; }
    if(e.key==='Enter'){ const h=oss.querySelector('.ss-opt.hl:not([hidden])'); if(h){ e.preventDefault(); selectSS(oss,h.dataset.v); oss.querySelector('.ss-btn').focus(); } return; }
    if(e.key==='Tab') closeAllSS();
  }
  if(e.key==='Escape' && $('#ov').classList.contains('open')) closeOverlay();
  if(e.key==='Enter' && e.target.matches('tr[data-act="donor"]')) openDonor(e.target.dataset.d);
  if((e.key==='n'||e.key==='N') && !e.metaKey && !e.ctrlKey && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !$('#ov').classList.contains('open')){ e.preventDefault(); openNewRequest(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='dq'){ UI.q=e.target.value; $('#dtable').innerHTML=donorRows(); }
  if(e.target.matches('[data-ss-search]')) filterSS(e.target.closest('.ss'),e.target.value);
  if(e.target.dataset && e.target.dataset.phone){ const k=e.target.dataset.phone; const c=cleanPhone(e.target.value,k); if(c!==e.target.value) e.target.value=c; const st=phoneStatus(c,k); const el=e.target.parentElement.querySelector('.ph-c'); if(el){ el.className='ph-c '+st.cls; el.textContent=st.txt; } }
  if(e.target.dataset && e.target.dataset.digits){ const c=e.target.value.replace(/\D/g,'').slice(0,+e.target.dataset.digits); if(c!==e.target.value) e.target.value=c; }
  if(e.target.name==='sender'||e.target.name==='name'){ const p=document.querySelector('[data-sender-preview]'); const form=e.target.closest('form'); if(p&&form){ const f=new FormData(form); p.innerHTML=senderPreview({...S.bank,sender:f.get('sender'),name:f.get('name')})+'<span class="t">Bloodo</span>'; } }
  if(e.target.closest('[data-form="new-request"]')) updatePreview();
  if(e.target.closest('.bf')) e.target.closest('.bf').classList.remove('err');

});
document.addEventListener('change',e=>{
  const t=e.target, form=t.closest('form');
  if(form && form.dataset.form==='new-request') updatePreview();
  if(form && form.dataset.form==='quick-request') updateQuick();
  if(t.name==='state' && form){ const ds=form.querySelector('[data-ss="district"]'); if(ds) setSSOptions(ds,INDIA[t.value]||[],''); }
  if((t.name==='district'||t.name==='state') && form && form.dataset.form==='new-request'){
    const a=form.querySelector('[name="area"]'), pn=form.querySelector('[name="pin"]'), ln=form.querySelector('[name="locName"]');
    if(a&&a.value===S.bank.area) a.value=''; if(pn&&pn.value===S.bank.pin) pn.value=''; if(ln&&ln.value===S.bank.name) ln.value='';
    if(ln) ln.placeholder='Hospital or camp where donors should go';
    updatePreview(); }
  if(t.name==='nbDate' && form){ const tss=form.querySelector('[data-ss="nbTime"]'); const cur=tss.querySelector('input').value; const opts=timeOpts(t.value); const ok=opts.find(o=>o.v===cur&&!o.dis); setSSOptions(tss,opts,ok?cur:(opts.find(o=>!o.dis)||{v:''}).v); }
  if((t.name==='nbDate'||t.name==='nbTime') && form){ form.querySelectorAll('[data-act="nb-quick"]').forEach(c=>c.setAttribute('aria-pressed','false')); updatePreview(); }
  if(t.name==='hours' && form){ const h=form.querySelector('[data-hours]'); if(h) h.hidden=t.value==='24h'; }
  if(t.name==='dob'){ const b=form&&form.querySelector('[data-age-for="dob"]'); const a=ageFrom(t.value); if(b){ b.hidden=a===null; b.querySelector('b').textContent=a??''; b.classList.toggle('warn',a!==null&&(a<18||a>65)); }
    const h=form&&form.querySelector('[data-hint-for="dob"]'); if(h){ h.className='hint dp-hint '+(a===null?'':(a<18||a>65)?'bad':'good'); h.textContent= a===null?'Donors must be 18 to 65 years old.' : a<18?`Not eligible: ${a} is under 18.` : a>65?`Not eligible: ${a} is over 65.` : `Age ${a}: eligible by age.`; } }
  if(t.name==='lastMode' && form){ const dp=form.querySelector('[data-dp="lastDate"]'); const off=t.value!=='date'; dp.querySelector('input').disabled=off; const btn=dp.querySelector('.ss-btn'); btn.disabled=off; btn.classList.toggle('disabled',off); if(off){ dp.querySelector('input').value=''; const l=dp.querySelector('.bf-v'); l.textContent=l.dataset.ph; l.classList.add('ph'); } else dpOpen(dp); }
});
document.addEventListener('submit',e=>{
  const form=e.target; const k=form.dataset.form; if(!k) return; e.preventDefault();
  const f=new FormData(form);
  if(k==='new-request'){
    const err=form.querySelector('[data-err]'); const group=f.get('group'); const nb=neededByFrom(f);
    if(!group){ err.hidden=false; err.textContent='Choose the blood group needed.'; return; }
    if(!nb||nb<now()){ err.hidden=false; err.textContent='Pick a date and time in the future.'; markErr(form,'nbTime'); return; }
    const loc=formLoc(form); if(!loc.district){ err.hidden=false; err.textContent='Choose the district where donors should come.'; markErr(form,'district'); return; }
    if(loc.pin && !validPin(loc.pin)){ err.hidden=false; err.textContent='Enter a 6-digit PIN code that doesn’t start with 0.'; markErr(form,'pin'); return; }
    const req={ id:uid('r'), kind:'urgent', group, comp:f.get('comp'), units:+f.get('units'), neededBy:nb, priority:f.get('priority'), ref:(f.get('ref')||'').trim(), notes:(f.get('notes')||'').trim(),
      createdAt:now(), status:'finding', wave:0, waveDeadline:0, radius:S.rules.radiusKm, invites:[], skipped:{}, loc, log:[{at:now(),t:locChanged(loc)?`Request created for ${loc.name}`:'Request created'}] };
    S.requests.push(req); startRequest(req); save(); closeOverlay(); location.hash='#/request/'+req.id;
    toast(req.status==='queued'?'Request queued for the morning':req.status==='stalled'?'No eligible donors found nearby':`Wave 1 sent on WhatsApp`, req.status==='finding'?'ok':'');
  }
  if(k==='add-patient'){
    const err=form.querySelector('[data-err]'); const v=x=>(f.get(x)||'').toString().trim(); const errs=[];
    form.querySelectorAll('.err').forEach(x=>x.classList.remove('err'));
    if(v('name').length<2) errs.push(['name','Enter the patient’s name.']);
    if(!/^\d{1,2}$/.test(v('age'))) errs.push(['age','Enter the age in whole years, 0 to 99.']);
    if(!v('group')) errs.push(['group','Choose a blood group.']);
    if(!v('next')) errs.push(['next','Pick the next transfusion date.']);
    if(!/^[6-9]\d{9}$/.test(cleanPhone(v('gphone'),'mobile'))) errs.push(['gphone','Enter the contact’s 10-digit mobile number. It starts with 6, 7, 8 or 9.']);
    if(v('next')){ const at=new Date(`${v('next')}T${v('slot')||'10:00'}`).getTime(); if(at<=now()) errs.push(['next','Pick a date and time in the future.']); }
    if(!f.get('consent')) errs.push(['consent','Consent is needed before Bloodo arranges donors.']);
    if(errs.length){ const f0=errs.map(([x])=>markErr(form,x))[0]; err.hidden=false; err.textContent=errs.map(x=>x[1]).join(' '); f0&&f0.focus&&f0.focus(); return; }
    const P={ id:uid('p'), name:v('name'), age:+v('age'), condition:v('condition'), group:v('group'), interval:+v('interval'), units:+v('units')||1, nextAt:new Date(`${v('next')}T${v('slot')||'10:00'}`).getTime(),
      guardian:v('guardian')||'Not given', guardianPhone:cleanPhone(v('gphone'),'mobile'), leuco:!!f.get('leuco'), phenotype:!!f.get('phenotype'), circle:[], rot:0, active:true, addedAt:now(), history:[] };
    S.patients.push(P); buildCircle(P,S.rules.circleSize); save(); closeOverlay(); location.hash='#/patient/'+P.id;
    toast(`${esc(first(P.name))} added with ${P.circle.length} donor${P.circle.length===1?'':'s'} in the circle`,'ok');
  }
  if(k==='edit-next'){
    const P=S.patients.find(x=>x.id===form.dataset.p); const at=new Date(`${f.get('next')}T${f.get('slot')||'10:00'}`).getTime(); const err=form.querySelector('[data-err]');
    if(!(at>now())){ err.hidden=false; err.textContent='Pick a date and time in the future.'; return; }
    const old=bookingFor(P); if(old && ['finding','covered','queued','stalled'].includes(old.status)){ old.status='cancelled'; old.closedAt=now(); old.invites.forEach(v=>{ if(['sent','seen','yes'].includes(v.status)){ v.status='cancelled'; v.at=now(); } }); logR(old,'Transfusion moved. Donors were told'); }
    P.nextAt=at; save(); closeOverlay(); render(); toast(`Next transfusion moved to ${shortDay(at)}`,'ok');
  }
  if(k==='quick-request'){
    const err=form.querySelector('[data-err]'); const group=f.get('group');
    if(!group){ err.hidden=false; err.textContent='Choose the blood group needed.'; return; }
    const loc=bankLoc();
    const req={ id:uid('r'), kind:'urgent', group, comp:f.get('comp'), units:+f.get('units'), neededBy:quickWhen(f.get('when')), priority:'urgent', ref:'', notes:'',
      createdAt:now(), status:'finding', wave:0, waveDeadline:0, radius:S.rules.radiusKm, invites:[], skipped:{}, loc, log:[{at:now(),t:'Request created'}] };
    S.requests.push(req); startRequest(req); save(); location.hash='#/request/'+req.id;
    toast(req.status==='queued'?'Request queued for the morning':req.status==='stalled'?'No eligible donors found nearby':'Wave 1 sent on WhatsApp', req.status==='finding'?'ok':'');
  }
  if(k==='add-donor'){ const d=readDonor(form); if(!d) return; S.donors.push(d); save(); closeOverlay(); render(); toast(`${esc(first(d.name))} added. A WhatsApp welcome message confirms their consent.`,'ok'); }
  if(k==='camp-donor'){ const c=S.camps.find(x=>x.id===form.dataset.c); const d=readDonor(form,{state:c.state,district:c.district,source:c.id}); if(!d) return; S.donors.push(d); save(); render(); toast(`${esc(first(d.name))} registered`,'ok'); setTimeout(()=>{const n=$('#f-name'); n&&n.focus();},30); }
  if(k==='new-camp'){ const name=(f.get('name')||'').trim(), venue=(f.get('venue')||'').trim(); const err=form.querySelector('[data-err]');
    if(!name||!venue||!f.get('date')){ err.hidden=false; err.textContent='Add a name, date and venue for the camp.'; return; }
    const c={id:uid('c'),name,venue,organiser:(f.get('organiser')||'').trim()||'Your centre',date:new Date(f.get('date')+'T10:00').getTime(),units:0,state:S.bank.state,district:S.bank.district};
    S.camps.push(c); save(); closeOverlay(); location.hash='#/camp/'+c.id; toast('Camp created'); }
  if(k==='rules'){ const R=S.rules; const RANGE={maxPerMonth:[1,4,'Requests per donor each month'],restAfterNo:[1,60,'Days of rest'],quietStart:[0,23,'Quiet hours start'],quietEnd:[0,23,'Quiet hours end'],perUnit:[1,10,'Donors per unit'],timeoutMin:[5,120,'Minutes before the next wave'],radiusKm:[2,60,'Search distance'],maxWaves:[1,8,'Most waves']};
    form.querySelectorAll('.err').forEach(x=>x.classList.remove('err')); const bad=[];
    Object.entries(RANGE).forEach(([x,[lo,hi,l]])=>{ const raw=(f.get(x)||'').toString().trim(); const n=Number(raw); if(raw===''||!Number.isInteger(n)||n<lo||n>hi){ bad.push(`${l}: ${lo} to ${hi}.`); markErr(form,x); } });
    if(bad.length){ toast('Check the highlighted rules. '+esc(bad[0])); return; }
    Object.keys(RANGE).forEach(x=>R[x]=parseInt(f.get(x),10)); save(); toast('Rules saved','ok'); }
  if(k==='centre'){
    const v=x=>(f.get(x)||'').toString().trim(); const err=form.querySelector('[data-err]'); const errs=[];
    form.querySelectorAll('.err').forEach(e=>e.classList.remove('err'));
    if(v('name').length<3) errs.push(['name','Enter the centre name.']);
    if(!v('district')) errs.push(['district','Choose a district.']);
    if(v('pin')&&!validPin(v('pin'))) errs.push(['pin','Enter a 6-digit PIN code that doesn’t start with 0.']);
    if(!/^\d{10,11}$/.test(cleanPhone(v('phone'),'landline'))) errs.push(['phone','Enter a 10-digit mobile, or a landline with STD code (10 or 11 digits).']);
    if(v('email')&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email'))) errs.push(['email','Enter a valid email address.']);
    if(v('hours')==='set' && v('open')>=v('close')) errs.push(['close','Closing time must be after opening time.']);
    if(errs.length){ const f0=errs.map(([k])=>markErr(form,k))[0]; err.hidden=false; err.textContent=errs.map(e=>e[1]).join(' '); f0&&f0.focus&&f0.focus(); return; }
    const B=S.bank; ['name','short','type','licence','officer','address','state','district','area','city','pin','phone','email','hours','open','close','sender'].forEach(x=>B[x]=v(x)); B.phone=cleanPhone(B.phone,'landline');
    B.short=B.short||B.name; B.sender=B.sender||B.short;
    Object.keys(COMP).forEach(k=>B.services[k]=!!f.get('svc_'+k));
    save(); render(); toast('Centre profile saved','ok'); }
});
window.addEventListener('hashchange',()=>{ render(); window.scrollTo(0,0); });

/* ---------- boot ---------- */
let timer=null;
function boot(fresh){
  S=fresh?null:load();
  if(!S){ seed();
    const live={ id:'r3', kind:'urgent', group:'A+', comp:'rbc', units:2, neededBy:now()+5*3600e3, priority:'urgent', ref:'Ward 7, bed 22', notes:'Post-delivery bleeding',
      createdAt:now(), status:'finding', wave:0, waveDeadline:0, radius:S.rules.radiusKm, invites:[], skipped:{}, log:[{at:now(),t:'Request created'}] };
    S.requests.push(live); sendWave(live); save();
  }
  migrate(); applyTheme(); render();
  if(timer) clearInterval(timer); timer=setInterval(tick,1000);
}
boot();
</script>
